debug = false
dev_mode = false
listen_addr = ":80"
http_timeout = "30s"
# secret for jwt tokens, replace with a long random string
jwt_secret = "..."
# max character count for all files in a document combined (0 to disable)
max_document_size = 0
# max character count for a single file to be highlighted (0 to disable)
max_highlight_size = 0
# load custom chroma xml or base16 yaml themes from this directory, leave empty to disable
custom_styles = "custom_styles"
default_style = "onedark"

[log]
# level can be "debug", "info", "warn", "error" (or -4, 0, 4, 8)
level = "info"
# format can be "text" or "json"
format = "text"
add_source = false
no_color = false

[database]
# type can be "sqlite" or "postgres"
type = "postgres"
debug = false
expire_after = "0"
cleanup_interval = "1m"
# path is only used for SQLite (use "/var/lib/gobin/gobin.db" with Docker)
path = "gobin.db"
# host, port, username, password, database, ssl_mode are only used for PostgreSQL
host = "database"
port = 5432
username = "gobin"
password = "gobin"
database = "gobin"
ssl_mode = "disable"

[rate_limit]
enabled = false
requests = 10
duration = "1m"
whitelist = ["127.0.0.1"]
blacklist = ["123.456.789.0"]

[preview]
enabled = false
inkscape_path = "inkscape"
max_lines = 0
dpi = 120
cache_size = 1024
cache_ttl = "1h"

[otel]
enabled = false
instance_id = "1"

[otel.trace]
enabled = false
endpoint = "localhost:4318"
insecure = true

[otel.metrics]
enabled = false
listen_addr = ":9100"

[webhook]
enabled = false
timeout = "10s"
max_tries = 3
backoff = "1s"
backoff_factor = 2
max_backoff = "5m"
